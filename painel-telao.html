<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mar de Antunes — Telão ao vivo</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#07121f;--card:#0f2238;--line:#1d3149;--tx:#eef3f8;--mut:#8ea3b8;--ac:#d9ab45;--rs:#ffd43b;--vd:#ff4d5e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
/* palco fixo 1920x1080, escalado para caber em qualquer tela */
#palco{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;padding:34px 40px}
.topo{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
h1{margin:0;font-size:38px;font-weight:700;letter-spacing:.2px}
.leg{display:flex;gap:26px;margin-top:10px;font-size:19px;color:var(--mut)}
.leg i{display:inline-block;width:20px;height:20px;border-radius:5px;margin-right:9px;vertical-align:-3px}
.status{font-size:17px;color:var(--mut);display:flex;align-items:center;gap:9px;margin-top:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#3fa66a}
.dot.off{background:#ff4d5e}
.tot{display:flex;gap:16px;margin-bottom:22px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 26px;min-width:200px}
.tc b{display:block;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.tc span{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.tc.v b{color:var(--vd)}.tc.r b{color:var(--rs)}
.tc.pc{flex:1;max-width:520px}
.bar{height:12px;border-radius:6px;background:#162a40;margin-top:10px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.blocos{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
.casas{display:grid;grid-template-columns:21fr 12fr;gap:18px}
.bl{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px 20px}
.bl h2{margin:0 0 4px;text-align:center;font-size:26px;letter-spacing:2px;text-transform:uppercase}
.bl .cn{text-align:center;font-size:15px;color:var(--mut);margin-bottom:12px}
.bl .cn em{font-style:normal;font-weight:700}
.bl .cn .v{color:var(--vd)}.bl .cn .r{color:var(--rs)}
.pv{margin-top:10px}
.pv h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--ac);text-transform:uppercase;letter-spacing:1.2px}
.us{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.casas .us{grid-template-columns:repeat(21,1fr)}
.casas .bl:last-child .us{grid-template-columns:repeat(12,1fr)}
.u{height:40px;border-radius:8px;display:grid;place-items:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);transition:background .5s,color .5s}
.u.r{background:var(--rs);color:#1a1405;box-shadow:none}
.u.v{background:var(--vd);color:#fff;box-shadow:none}
.u.novo{animation:pisca 1.2s ease-in-out 3}
@keyframes pisca{50%{transform:scale(1.18);box-shadow:0 0 0 4px rgba(255,255,255,.6)}}
@media (prefers-reduced-motion:reduce){.u.novo{animation:none}}
</style>
</head>
<body>
<div id="palco">
  <div class="topo">
    <div>
      <h1>Mar de Antunes Resort · Disponibilidade ao vivo</h1>
      <div class="leg"><span><i style="box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)"></i>Disponível</span><span><i style="background:#ffd43b"></i>Reservada</span></div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="stx">conectando…</span></div>
  </div>
  <div class="tot" id="tot"></div>
  <div class="blocos" id="blocos"></div>
  <div class="casas" id="casas"></div>
</div>
<script>
var WORKER_URL="https://mardeantunes.comercial-freitasconstrucoes.workers.dev";
/* unidades que saíram da tabela de 24/11 (vendidas): sempre aparecem como vendidas */
var VENDIDAS_TABELA=["A-104","A-106","A-205","A-406","A-505","A-506","B-205","B-206","B-404","B-405","B-505","B-506","B-511","B1-C04","B1-C09","B1-C14","B1-C19","B2-C25","B2-C31","B2-C32"];
var NOMES=["Jardim","Terraço","3º Pavimento","4º Pavimento","5º Pavimento"];
var BLOCOS=[{id:"A",n:[9,9,9,9,9]},{id:"B",n:[9,9,18,18,18]},{id:"C",n:[9,18,18,18]},{id:"D",n:[9,18,18,18]}];
var CASAS=[{id:"B1",nome:"Casas tipo 1",de:1,ate:21},{id:"B2",nome:"Casas tipo 2",de:22,ate:33}];
function pad(n){return n<10?"0"+n:""+n}
var TODAS=[];
BLOCOS.forEach(function(b){b.pv=b.n.map(function(q,i){var us=[];for(var j=1;j<=q;j++){var d=(i+1)+pad(j);us.push({k:b.id+"-"+d,d:d});TODAS.push(b.id+"-"+d)}return{nome:NOMES[i],us:us}})});
CASAS.forEach(function(c){c.us=[];for(var j=c.de;j<=c.ate;j++){var k=c.id+"-C"+pad(j);c.us.push({k:k,d:pad(j)});TODAS.push(k)}});
var ANT=null;
function cls(s){return s==="v"?"v":s==="r"?"r":""}
function qd(u,S){var s=S[u.k]||"d",n=ANT&&(ANT[u.k]||"d")!==s?" novo":"";return '<div class="u '+cls(s)+n+'">'+u.d+'</div>'}
function conta(us,S){var v=0,r=0;us.forEach(function(u){var s=S[u.k];if(s==="v")v++;else if(s==="r")r++});return{v:v,r:r,d:us.length-v-r}}
function cnt(c){return '<div class="cn"><em class="r">'+c.r+'</em> reservadas · '+c.d+' disponíveis</div>'}
function render(S,real){
  S=Object.assign({},S||{});VENDIDAS_TABELA.forEach(function(k){S[k]="v"});Object.keys(S).forEach(function(k){if(S[k]==="v")S[k]="r"});
  document.getElementById("blocos").innerHTML=BLOCOS.map(function(b){
    var all=[];b.pv.forEach(function(p){all=all.concat(p.us)});
    return '<div class="bl"><h2>Bloco '+b.id+'</h2>'+cnt(conta(all,S))+b.pv.map(function(p){
      return '<div class="pv"><h3>'+p.nome+'</h3><div class="us">'+p.us.map(function(u){return qd(u,S)}).join("")+'</div></div>';
    }).join("")+'</div>';
  }).join("");
  document.getElementById("casas").innerHTML=CASAS.map(function(c){
    return '<div class="bl"><h2>'+c.nome+'</h2>'+cnt(conta(c.us,S))+'<div class="us">'+c.us.map(function(u){return qd(u,S)}).join("")+'</div></div>';
  }).join("");
  var v=0,r=0;TODAS.forEach(function(k){if(S[k]==="v")v++;else if(S[k]==="r")r++});
  var T=TODAS.length,d=T-v-r,pc=Math.round((v+r)/T*100);
  document.getElementById("tot").innerHTML=
    '<div class="tc"><b>'+T+'</b><span>Unidades</span></div>'+
    '<div class="tc r"><b>'+r+'</b><span>Reservadas</span></div>'+
    '<div class="tc"><b>'+d+'</b><span>Disponíveis</span></div>'+
    '<div class="tc pc"><b>'+pc+'%</b><span>Do empreendimento reservado</span><div class="bar"><i style="width:'+(v/T*100)+'%;background:var(--vd)"></i><i style="width:'+(r/T*100)+'%;background:var(--rs)"></i></div></div>';
  if(real)ANT=S;
}
function ajusta(){var p=document.getElementById("palco"),s=Math.min(innerWidth/1920,innerHeight/1080);p.style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",ajusta);ajusta();
var ok=0;
function tick(){
  fetch(WORKER_URL+"/status",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    render(j||{},true);ok=Date.now();
    document.getElementById("dot").className="dot";document.getElementById("stx").textContent="atualizado agora";
  }).catch(function(){
    document.getElementById("dot").className="dot off";
    var s=ok?Math.round((Date.now()-ok)/1000):null;
    document.getElementById("stx").textContent=s!=null?"sem conexão · última atualização há "+s+"s":"sem conexão";
  });
}
render({});tick();setInterval(tick,5000);
</script>
</body>
</html>
