  postEspera(sel,nm,tl,em);
  }catch(err){var e2=$("er");if(e2)e2.textContent="Erro: "+(err&&err.message||err)}
}
function postEspera(un,nm,tl,em){
  sheetBackup((isBg(B.id)?"casa":"apto")+"_espera",nm,tl,em,bnPT(),un);
  var wa="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Olá, Erica Carneiro! Quero entrar na lista de espera "+(isBg(B.id)?"da casa "+un.slice(1)+" do "+bnPT():"do apartamento "+un+" do "+bnPT())+" – "+NOME+".\nNome: "+nm+"\nTelefone: "+tl+"\nE-mail: "+em);
  var hd='<div class="grab"></div><div class="sh"><div><div class="tag">// '+bname(B)+' · '+udisp(un)+'</div><h3>';
  var xb='</h3></div><button class="x" onclick="fechar()">✕</button></div>';
  function tela(tt,tx){$("sheet").scrollTop=0;$("sheet").innerHTML=hd+tt+xb+'<p class="note" style="font-size:14px;margin:16px 0 18px">'+tx+'</p><a class="cta" href="'+wa+'" target="_blank" rel="noopener">'+t("wab")+'</a>'}
  if(!WORKER_URL){tela(t("wl"),t("wlviaw"));return}
  var b=$("wj")||$("wa");if(b){b.disabled=true;b.textContent=t("sending")}
  var er=$("wer")||$("er");
  fetch(WORKER_URL+"/espera",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({nome:nm,telefone:tl,email:em,unidade:un,bid:B.id,consent:true,site:""})})
   .then(function(r){return r.json().catch(function(){return{}})}).then(function(j){
     if(j&&j.ok){track("espera",un);mrAdd({id:un+"_"+Date.now(),tipo:isBg(B.id)?"casa":"apto",un:un,bn:bnPT(),nm:nm,area:"",status:"e",ts:Date.now(),bid:B.id,k:(window.curKS&&window.curKS[0])||null,s:(window.curKS&&window.curKS[1])||null});tela(t("wlok"),t("wlokp").replace("{u}",udisp(un))+(j.pos?" "+t("pos")+" "+j.pos+"º.":""))}
     else{if(b){b.disabled=false;b.textContent=t("wlsend")}if(er)er.textContent=t("okf")}
   }).catch(function(){if(b){b.disabled=false;b.textContent=t("wlsend")}if(er)er.textContent=t("okf")});
}
function fechar(){goBack()}
$("ov").onclick=function(e){if(e.target===this)fechar()};
(function(){var sh=$("sheet"),y0=null,dy=0;
 sh.addEventListener("touchstart",function(e){y0=sh.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
 sh.addEventListener("touchmove",function(e){if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.style.transition="none";sh.style.transform="translateY("+dy+"px)"}},{passive:true});
 sh.addEventListener("touchend",function(){if(y0===null)return;sh.style.transition="transform .25s";if(dy>110){sh.style.transform="translateY(100%)";setTimeout(function(){sh.style.transform="";sh.style.transition="";fechar()},200)}else sh.style.transform="";y0=null});
})();
